<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveKit Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      padding: 24px;
      max-width: 700px;
      margin: auto;
    }
    input, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      font-size: 14px;
    }
    input, textarea {
      background: #1f2937;
      color: white;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    #status {
      margin-top: 12px;
      color: #93c5fd;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>LiveKit Connection Test</h1>

  <input id="lkUrl" placeholder="wss://your-project.livekit.cloud" />
  <textarea id="lkToken" rows="6" placeholder="Paste token here"></textarea>
  <button id="joinBtn">Join</button>

  <div id="status">Page loaded. Waiting.</div>

  <script>
    const statusEl = document.getElementById("status");
    const joinBtn = document.getElementById("joinBtn");

    statusEl.textContent = "Script loaded successfully.";

    joinBtn.addEventListener("click", () => {
      const url = document.getElementById("lkUrl").value.trim();
      const token = document.getElementById("lkToken").value.trim();

      if (!url || !token) {
        statusEl.textContent = "Please paste both LiveKit URL and token.";
        return;
      }

      statusEl.textContent = "Button click works.\nURL entered: " + url + "\nToken length: " + token.length;
    });
  </script>
</body>
</html>
